name: Deploy ACS Web (Test) to DigitalOcean

on:
  push:
    branches:
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          command_timeout: 60m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /var/www/test-acs-web
            git fetch origin test
            git reset --hard origin/test
            npm install
            # Stop PM2 before cleaning/building so live ISR cache writes into .next/standalone cannot cause ENOTEMPTY
            pm2 stop test-acs-web 2>/dev/null || true
            # Clean previous .next build directory completely before rebuilding
            rm -rf .next
            npm run build
            cp -r .next/static .next/standalone/.next/static
            cp -r public .next/standalone/public
            pm2 restart test-acs-web || pm2 start ecosystem.config.js --only test-acs-web
            pm2 save
